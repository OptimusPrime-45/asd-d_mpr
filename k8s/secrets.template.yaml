# Production Secrets Template for Kubernetes (AWS EKS)
# Replace with base64-encoded values or apply using kubectl:
# kubectl create secret generic odoo-secrets -n odoo-app \
#   --from-literal=DATABASE_URL="postgresql://<user>:<password>@<rds-endpoint>:5432/<dbname>?schema=public" \
#   --from-literal=JWT_SECRET="<your-strong-random-jwt-secret>" \
#   --from-literal=JIRA_HOST="your-domain.atlassian.net" \
#   --from-literal=JIRA_EMAIL="your-email@example.com" \
#   --from-literal=JIRA_API_TOKEN="your-api-token" \
#   --from-literal=JIRA_PROJECT_KEY="FLEET"
apiVersion: v1
kind: Secret
metadata:
  name: odoo-secrets
  namespace: odoo-app
type: Opaque
stringData:
  DATABASE_URL: "postgresql://admin:password@postgres:5432/logistics_db?schema=public"
  JWT_SECRET: "replace-with-a-secure-production-jwt-secret"
  PORT: "3000"
  NODE_ENV: "production"
  # Atlassian Jira Configuration
  JIRA_HOST: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  JIRA_PROJECT_KEY: ""
