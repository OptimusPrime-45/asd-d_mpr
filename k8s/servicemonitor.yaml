apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: odoo-backend-monitor
  namespace: odoo-app
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: odoo-backend
  namespaceSelector:
    matchNames:
      - odoo-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
