apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-backend
  namespace: odoo-app
  labels:
    app: odoo-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo-backend
  template:
    metadata:
      labels:
        app: odoo-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3000"
    spec:
      containers:
        - name: backend
          image: odoo-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://admin:password@postgres:5432/logistics_db?schema=public"
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-backend
  namespace: odoo-app
  labels:
    app: odoo-backend
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000
      name: http
  selector:
    app: odoo-backend
