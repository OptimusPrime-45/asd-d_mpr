apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-frontend
  namespace: odoo-app
  labels:
    app: odoo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo-frontend
  template:
    metadata:
      labels:
        app: odoo-frontend
    spec:
      containers:
        - name: frontend
          image: odoo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:30000"
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-frontend
  namespace: odoo-app
  labels:
    app: odoo-frontend
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
      name: http
  selector:
    app: odoo-frontend
