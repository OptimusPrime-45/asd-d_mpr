apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: odoo-app
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: odoo-app
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-odoo
  namespace: odoo-app
data:
  odoo-backend.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "stat",
          "title": "Total HTTP Requests",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(http_requests_total)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Error Rate (5xx)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(http_requests_total{status_code=~\"5..\"}[5m])) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "HTTP Requests Per Second (RPS) by Route",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(http_requests_total[1m])) by (route, method)",
              "legendFormat": "{{method}} {{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 Response Time (Latency)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 latency (s)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Backend Memory Usage (Heap / RSS)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "odoo_backend_process_resident_memory_bytes / 1024 / 1024",
              "legendFormat": "Memory RSS (MB)",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["express", "node", "odoo"],
      "time": { "from": "now-15m", "to": "now" },
      "title": "Odoo Backend - Service Overview",
      "uid": "odoo-backend-overview"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: odoo-app
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-files
          configMap:
            name: grafana-dashboard-odoo
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: odoo-app
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002
      name: http
  selector:
    app: grafana
